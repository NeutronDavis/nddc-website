trigger:
- master

pool:
  vmImage: ubuntu-latest

variables:
  appName: nddc-website
  serviceName: nddc-website
  projectPath: NDDC-Website-2024/NDDC-Website-2024.csproj

steps:
- task: UseDotNet@2
  inputs:
    packageType: sdk
    version: 8.x

- script: |
    dotnet restore
    dotnet build -c Release --no-restore
    dotnet publish $(projectPath) -c Release --no-build -o $(Build.ArtifactStagingDirectory)/publish
  displayName: Build and publish

- script: |
    mkdir -p ~/.ssh
    echo "$(HETZNER_SSH_KEY)" > ~/.ssh/hetzner_key
    chmod 600 ~/.ssh/hetzner_key
    ssh-keyscan -H $(HETZNER_HOST) >> ~/.ssh/known_hosts

    RELEASE=$(date +%Y%m%d%H%M%S)

    ssh -i ~/.ssh/hetzner_key $(HETZNER_USER)@$(HETZNER_HOST) "mkdir -p /srv/apps/$(appName)/releases/$RELEASE"

    scp -i ~/.ssh/hetzner_key -r $(Build.ArtifactStagingDirectory)/publish/* $(HETZNER_USER)@$(HETZNER_HOST):/srv/apps/$(appName)/releases/$RELEASE/

    ssh -i ~/.ssh/hetzner_key $(HETZNER_USER)@$(HETZNER_HOST) "
      PREVIOUS=\$(readlink -f /srv/apps/$(appName)/current || true) &&
      ln -sfn /srv/apps/$(appName)/releases/$RELEASE /srv/apps/$(appName)/current &&
      sudo systemctl restart $(serviceName) &&
      sleep 5 &&
      if curl -fsS http://127.0.0.1:5001 > /dev/null; then
        echo 'Deployment successful';
        sudo systemctl status $(serviceName) --no-pager;
      else
        echo 'Health check failed. Rolling back...';
        ln -sfn \$PREVIOUS /srv/apps/$(appName)/current;
        sudo systemctl restart $(serviceName);
        exit 1;
      fi
    "
  displayName: Deploy to Hetzner